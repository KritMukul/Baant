# Installed on the host as /etc/nginx/sites-available/dibs.
# HTTPS uses the certificate certbot already issued: sudo certbot certonly --nginx -d dibs.krit.website -d krit.website -d www.krit.website
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://dibs.krit.website$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name krit.website www.krit.website;
    ssl_certificate /etc/letsencrypt/live/krit.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krit.website/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://dibs.krit.website$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dibs.krit.website;
    ssl_certificate /etc/letsencrypt/live/krit.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krit.website/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20m;   # bill photos
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
