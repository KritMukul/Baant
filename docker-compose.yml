# Dibs on one server: the app, its own Postgres, and Caddy for automatic HTTPS.
#   cp .env.example .env     (fill it in)
#   docker compose up -d --build
# Nothing here needs a Supabase account. To use Supabase instead, drop the `db` service and point
# DATABASE_URL at your Supabase connection string (see docs/DEPLOY.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dibs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dibs
    volumes:
      - dbdata:/var/lib/postgresql/data
      # runs once, the first time the database is created
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dibs -d dibs"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dibs:${POSTGRES_PASSWORD}@db:5432/dibs
      APP_URL: ${APP_URL:?set APP_URL in .env, for example https://krit.website}
      BILL_PARSER: ${BILL_PARSER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      SCAN_LIMIT_PER_HOUR: ${SCAN_LIMIT_PER_HOUR:-20}
      SHOT_LIMIT_PER_HOUR: ${SHOT_LIMIT_PER_HOUR:-30}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, for example krit.website (or :80 to test over plain http)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  dbdata:
  caddydata:
  caddyconfig:
